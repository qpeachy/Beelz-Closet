services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beelz
      POSTGRES_PASSWORD: beelz
      POSTGRES_DB: beelz_closet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beelz -d beelz_closet"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dbmate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://beelz:beelz@postgres:5432/beelz_closet?sslmode=disable
    volumes:
      - ./db:/db
    command: ["--no-dump-schema", "up"]
    restart: "no"

volumes:
  postgres_data:
